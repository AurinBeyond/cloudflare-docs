        <!-- §TRUST-SIGNALS 2026-06-26 — JSON-LD Organization schema.
             Solves three problems at once:

          "name": "Matrix Aurin",
          "alternateName": "prulesoul",

          "logo": "https://prulesoul.site/og-cover.png",
          "description": "A quiet digital reading house for adults — letters, audio essays, and four reflective rooms.",

            "name": "Anna"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "info@prulesoul.site",
            "availableLanguage": ["en", "et"],
            "areaServed": "EU"
          },
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "EE"
          },
          "sameAs": []
        }
        </script>
